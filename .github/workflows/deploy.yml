name: Deploy to Interserver

on:
  push:
    branches:
      - gts-lw # Triggers only on this branch

jobs:
  deploy:
    name: Deploy Code
    runs-on: ubuntu-latest
    
    steps:
      - name: SSH into Interserver and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Deploying to Interserver..."
            
            # 1. Navigate to the app directory we created
            cd /var/www/gts-portal
            
            # 2. Discard any local changes on the server and pull fresh code
            git reset --hard
            git pull origin gts-lw
            
            # 3. (Optional) Backend Restart
            # Uncomment these when you are ready to auto-restart the backend
            # cd backend
            # npm install
            # pm2 restart server # Or whatever your pm2 process is named
            
            # 4. (Optional) Frontend Build
            # Uncomment these when you are ready to auto-build the React app
            # cd ../frontend
            # npm install
            # npm run build
            
            echo "Deployment successful!"