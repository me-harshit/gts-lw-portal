name: Deploy to Interserver

on:
  push:
    branches:
      - gts-lw # Triggers only on this branch

jobs:
  deploy:
    name: Deploy Code
    runs-on: ubuntu-latest
    
    steps:
      - name: SSH into Interserver and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Deploying to Interserver..."
            
            # 1. Navigate to the app directory
            cd /var/www/gts-portal
            
            # 2. Discard any local changes on the server and pull fresh code
            git fetch origin
            git reset --hard origin/gts-lw
            
            # 3. Build & Restart Backend
            echo "Building Backend..."
            cd backend
            npm install
            pm2 restart gts-backend
            pm2 save
            
            # 4. Build Frontend
            echo "Building Frontend..."
            cd ../frontend
            export VITE_API_URL=https://lw.gts.ai # Inject production URL
            npm install
            npm run build
            
            echo "Deployment and Build successful!"